[project]
name = "diferencijalna-jednacina"
version = "0.1.0"
description = "Numeričko rešavanje diferencijalne jednačine sistema masa-opruga-prigušivač"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "jupyter>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]
